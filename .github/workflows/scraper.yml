name: Carpark Scraper CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carpark-scraper-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate script
        run: python -m py_compile scraper.py

      - name: Run scraper
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: python scraper.py --out output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carpark-snapshot-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: error

      - name: Commit latest snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest.csv
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "chore: update carpark snapshot [skip ci]"
            git push
          fi
